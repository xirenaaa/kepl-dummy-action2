name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  # ==========================================
  # 1. TAHAP BUILD
  # ==========================================
  build:
    name: 1. Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, sqlite, pdo_sqlite
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

  # ==========================================
  # 2. TAHAP TEST
  # ==========================================
  test:
    name: 2. Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, sqlite, pdo_sqlite
          coverage: none

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare Application Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Automated Feature & Unit Tests
        run: php artisan test

  # ==========================================
  # 3. TAHAP STAGING
  # ==========================================
  staging:
    name: 3. Staging
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Staging Environment (Echo Simulation)
        run: |
          echo "=================================================="
          echo " [STAGING DEPLOYMENT] Simulasi Deploy ke Staging "
          echo "=================================================="
          echo "[STAGING] Mengambil image/build artifact..."
          echo "[STAGING] Melakukan sanity test di staging server..."
          echo "[STAGING] Status: Deployment ke server staging BERHASIL."
          echo "=================================================="

  # ==========================================
  # 4. TAHAP PRODUCTION
  # ==========================================
  production:
    name: 4. Production
    needs: staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make deploy.sh Executable
        run: chmod +x deploy.sh

      - name: Run 7-Step Deployment Script (Echo)
        run: |
          echo "=================================================="
          echo " [PRODUCTION DEPLOYMENT] Eksekusi 7 Langkah Deploy "
          echo "=================================================="
          ./deploy.sh
